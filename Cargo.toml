[package]
name = "mxswitch"
version = "0.1.1"
edition = "2021"
rust-version = "1.74"
description = "Move a Logitech Easy-Switch mouse (MX Master, MX Anywhere, ...) to your other PC with one press of its gesture button. Windows tray app + CLI, no Logi Options+ needed."
license = "MIT"
repository = "https://github.com/shivajreddy/mxswitch"
readme = "README.md"
keywords = ["logitech", "mx-master", "easy-switch", "hidpp", "hotkey"]
categories = ["command-line-utilities", "hardware-support"]
exclude = [".github/"]

[target.'cfg(windows)'.dependencies]
hidapi = "2"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
